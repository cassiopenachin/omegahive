name: omegahive

# Generic deployment profile (deployment spec §4). Every non-Postgres service runs
# the one `omegahive` image as a one-shot command — migrations, seed, the three
# acceptance actors, board-view, tests, lint, and the containerized pg_dump backup.
# A host needs only an OCI runtime (rootless Podman) + compose v2; no host runtimes.

# KNOWN HOST COUPLING, not yet fixed here — read before running `compose build`.
#
# This anchor carries `image:` AND `build: .`, and 13 services merge it. Because they all
# name ONE tag, a plain `compose build` (no service argument) asks for 13 build targets
# writing the same tag. Docker Compose v5 builds via buildx bake, which runs them in
# PARALLEL: the first writer wins and the other twelve fail with
# `failed to solve: image "omegahive:dev": already exists`, aborting the build. Proven on
# a macOS/Docker 29.2.1 host, 2026-07-29. Podman never shows it — `podman compose` does
# not parallelize build targets this way — so this is a coupling in the compose FILE,
# surviving even after the operator scripts learned to resolve the compose COMMAND.
#
# Until it is fixed, build ONE service and let the other twelve consume the tag:
#     docker compose build cli
# The documented quickstart below is unaffected: `compose run --rm <svc>` builds only that
# service's image, never all 13. `deploy/hive-user/compose.scratch.yml` already resets
# `build` on all but `cli` (its isolation 5), and the bring-up drill asserts that exactly
# one build target survives before it builds anything.
#
# The structural fix — one service owning `build:` here, the rest referencing the image —
# is deliberately NOT applied yet: it changes the auto-build behaviour of the live stack's
# own compose file, and it cannot be verified on deployment #0, which has no docker CLI
# and a compose route that does not exhibit the bug. It wants a Docker host to prove on.
x-omega: &omega
  image: omegahive:dev
  build: .
  env_file: [.env]
  environment:
    # port-library provenance passthrough (qual record pin). Empty default so a plain
    # deploy is unaffected; a deploy script injects the real commit sha at build/run
    # time. In-container with no override the pin falls back to the image:<id> sentinel.
    OMEGAHIVE_PORT_LIBRARY_SHA: ${OMEGAHIVE_PORT_LIBRARY_SHA:-}
  depends_on:
    postgres:
      condition: service_healthy
  volumes:
    # durable basis_seq per (run, actor) — crash-redispatch idempotency (port spec §3a).
    - omegahive-basis:/var/lib/omegahive

# --- the three DB credentials (migrations/0003_two_roles.sql) -----------------
#
# `.env` (in the anchor above) carries the READ credential and reaches EVERY service,
# which is exactly why nothing stronger may live there: a file every container reads
# grants every container what it holds. The two write-capable credentials are per-service
# env-files under ${OMEGAHIVE_SECRETS_DIR} instead, merged in below by the services that
# need them.
#
# Which service gets which is stated once, enforceably, in secrets-manifest.yaml — every
# row's `compose_services:` is what the credential scan checks the running containers
# against, so that file is the copy that cannot quietly go stale.
#
# ORDER IS LOAD-BEARING in `<<: [*gateway-env, *omega]`. A YAML merge key with a SEQUENCE
# resolves earlier entries first and never lets a later one override them, so the credential
# anchor must come BEFORE *omega — with the two swapped, *omega's `env_file: [.env]` wins,
# the per-service file is silently dropped, and every write path falls back to the read
# credential. That failure is invisible in `compose config`'s YAML output (which prints the
# anchors themselves as top-level `x-` keys, easily misread as a service's resolved value);
# `compose config --format json | jq '.services.<svc>.environment'` is what actually shows it.
#
# `required: false` so a host that has not cut over still parses and runs: with the file
# absent the variable is unset, connect_gateway()/connect_owner() fall back to the read
# DSN, and the stack behaves exactly as it did under one role. The cutover is therefore a
# deployment act (write the files, restart), never a code release — and it is reversible
# by deleting them. `scripts/credential_scope_scan.sh` is what keeps these lists honest:
# every key each container ends up with is diffed against secrets-manifest.yaml.
x-gateway-env: &gateway-env
  env_file:
    - .env
    - path: ${OMEGAHIVE_SECRETS_DIR:-${HOME}/.config/omegahive/secrets}/gateway.env
      required: false

x-owner-env: &owner-env
  env_file:
    - .env
    - path: ${OMEGAHIVE_SECRETS_DIR:-${HOME}/.config/omegahive/secrets}/owner.env
      required: false

services:
  postgres:
    image: postgres:16@sha256:1570e4013933875bf54995e9010e31420b5e21dd5f2524e5395089d480cc2df1
    container_name: omegahive-pg
    environment:
      POSTGRES_USER: omegahive
      POSTGRES_PASSWORD: omegahive
      POSTGRES_DB: omegahive
    # Loopback for everything on this host (deployment spec §7), plus ONE optional bind for
    # sandboxed workers, which cannot reach a host-local address at all.
    #
    # Why the second line exists. A worker in a Docker Sandboxes microVM egresses through an
    # HTTP/TLS proxy: raw TCP is terminated by the proxy and dropped, and `host.docker.internal`
    # is refused whatever the sandbox policy says (measured, Beastie 2026-08-24 — a direct
    # connect "succeeds" and a listener on the far side never sees it). What the proxy does
    # honour is HTTP CONNECT to an allowlisted host, which carries an arbitrary byte stream —
    # so the spine has to answer on an address that is ROUTABLE from the VM rather than
    # host-local. `hive-launch` allowlists exactly this host:port for the sandbox it creates
    # and forwards to it from inside; nothing else reaches this bind.
    #
    # OMEGAHIVE_PG_TAILNET_BIND is a DEPLOYMENT fact and belongs in this host's environment,
    # never in this file: on deployment #0 it is Beastie's tailscale address, whose tailnet is
    # two machines. Unset, this publishes a second loopback port and changes no exposure at
    # all, which is the correct default for a host that runs no sandboxed workers.
    ports:
      - "127.0.0.1:5432:5432"
      - "${OMEGAHIVE_PG_TAILNET_BIND:-127.0.0.1}:5433:5432"
    volumes:
      - omegahive-pgdata:/var/lib/postgresql/data
      # :ro,Z — SELinux relabel required for rootless Podman on Fedora/RHEL.
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omegahive"]
      interval: 2s
      timeout: 3s
      retries: 30

  # --- one-shot tooling services (the omegahive image) ----------------------

  # generic CLI entry: `docker compose run --rm cli <command …>` (the image ENTRYPOINT
  # is `omegahive`). Alias for daily use: alias omegahive='docker compose run --rm cli'
  cli:
    <<: [*gateway-env, *omega]
    command: ["--help"]

  # DDL, so the owner credential and no other. `db-migrate` is the one command that runs
  # as the owner; a container holding only hive_gateway fails it on privilege, which is
  # the correct answer (schema change is an operator act, not a running service's).
  # Doubles as the harness's owner-privileged shell: deploy_checks.sh drives
  # tests/scratch_db.py through THIS service, because creating and dropping databases
  # needs the same authority and must not put it in `cli`.
  migrate:
    <<: [*owner-env, *omega]
    command: ["db-migrate"]

  seed:
    <<: [*gateway-env, *omega]
    command: ["seed-demo", "--run-id", "${OMEGAHIVE_RUN_ID:-accept}",
              "--plan", "scenarios/demo_plan.yaml"]

  # The three acceptance actors — each its own process/container, coordinating only
  # through Postgres via the port. `compose up coordinator worker review` is the
  # multi-process acceptance run (deployment spec §7 step 6 / port spec §9).
  coordinator:
    <<: [*gateway-env, *omega]
    command: ["act", "coordinator", "--run-id", "${OMEGAHIVE_RUN_ID:-accept}", "--workers", "w1"]

  worker:
    <<: [*gateway-env, *omega]
    command: ["act", "worker", "--run-id", "${OMEGAHIVE_RUN_ID:-accept}", "--agent-id", "w1"]

  review:
    <<: [*gateway-env, *omega]
    command: ["act", "review", "--run-id", "${OMEGAHIVE_RUN_ID:-accept}"]

  board-view:
    <<: *omega
    command: ["board-view", "${OMEGAHIVE_RUN_ID:-accept}"]

  # The read-only operator web UI (ui spec §5). A long-running uvicorn server on the
  # omegahive image, reading the spine over the compose network (portfolio/board/events/
  # metrics screens; no write path). NOT a front door: the *host* publish is loopback-only.
  #
  # DEFAULT ACCESS, on any host, is that loopback publish: http://127.0.0.1:8811/omegahive
  # on the host itself, or through an SSH tunnel from anywhere else
  # (`ssh -L 8811:127.0.0.1:8811 <host>`). Nothing else is required, and no ingress ships
  # in this repo.
  #
  # An off-host ingress is a per-deployment ADDITION, not the story: deployment #0 puts a
  # house Caddy on :8443 in front, reverse-proxying https://<host>:8443/omegahive/ here,
  # reachable only over its tailnet (docs/deployments/deployment-0-beastie.md and
  # docs/deployments/omegahive_remote_access_spec.md). A second deployment needs none of
  # that to use the UI.
  #
  # Never publish this on 0.0.0.0. `--host 0.0.0.0` (ui-serve default) binds only the
  # container's own netns — the loopback host-publish below is the real boundary (same shape
  # postgres uses). OMEGAHIVE_UI_BASE_PATH is the serving prefix (config, not a secret);
  # empty serves at the root, and where a reverse proxy IS in front it must match that
  # proxy's handle block. Container listens on 8000; the app trusts proxy headers so
  # url_for reflects an external https origin when one exists.
  # The entry point is the portfolio — every live run on one page — so
  # the UI needs no default run; the two knobs below tune which runs and which tasks the
  # active view keeps, and the CLI reads the same two so both surfaces stay one board.
  ui:
    <<: *omega
    command: ["ui-serve"]
    environment:
      - OMEGAHIVE_UI_BASE_PATH=${OMEGAHIVE_UI_BASE_PATH:-/omegahive}
      - OMEGAHIVE_ACTIVE_WINDOW_DAYS=${OMEGAHIVE_ACTIVE_WINDOW_DAYS:-7}
      - OMEGAHIVE_PORTFOLIO_EXCLUDE=${OMEGAHIVE_PORTFOLIO_EXCLUDE:-tooling-drill-*}
    ports:
      # host loopback only -> container 8000. This publish IS the default access path
      # (http://127.0.0.1:8811/omegahive, or over an SSH tunnel). Change the host port via
      # OMEGAHIVE_UI_HOST_PORT; where a reverse proxy is in front, its target must match.
      # Never 0.0.0.0 (deployment posture).
      - "127.0.0.1:${OMEGAHIVE_UI_HOST_PORT:-8811}:8000"
    restart: unless-stopped

  # Full suite in-container (deployment spec §4: no host pytest).
  # The suite creates and drops a scratch database per run (tests/scratch_db.py), which
  # is owner authority — so tests carry owner.env and OMEGAHIVE_TEST_DATABASE_URL rides
  # there too, not in the shared .env where every read-only follower would inherit it.
  test:
    <<: [*owner-env, *omega]
    entrypoint: ["pytest"]
    command: ["-q"]

  lint:
    <<: *omega
    entrypoint: ["sh", "-c"]
    command: ["ruff check . && mypy"]

  deploy-checks:
    <<: [*gateway-env, *omega]
    command: ["deploy-checks"]

  # The LLM coordinator ladder (R1+). The provider key is a *host-passthrough* env var,
  # listed here with no value — compose forwards it only to services that declare it, so it
  # reaches this container but never `deploy-checks` (which declares none), and it is never
  # written to `.env`. That keeps the substrate credential scan honest (deployment/stage2
  # §5.2): the key lives only in the harness run context. Run e.g.
  #   OPENROUTER_API_KEY=… docker compose run --rm ladder smoke --model openrouter/<model>
  ladder:
    <<: [*gateway-env, *omega]
    environment:
      - OPENROUTER_API_KEY
      - ANTHROPIC_API_KEY
    entrypoint: ["ladder"]

  # The outbound attention-notifier (hive-native ops §2 item 4). A long-running follower
  # of the spine's *read path* — it pings Telegram on question/blocked/escalated so a
  # blocking question at 2am operator-time doesn't sit until the next manual check-in.
  # Outbound only: no inbound port, no ack path. The bot token lives in its own secrets
  # env-file (deployment spec §4), never in .env / the image / a log / a message. Its read
  # cursors persist on its own named volume, so a restart resumes without replay or
  # duplicate. Start it explicitly: `podman compose up -d notifier`.
  #
  # It is a PORTFOLIO surface, like the board: ONE instance follows every active run,
  # discovered from the spine's own registry through the same cut `hive portfolio` applies.
  # There is deliberately NO run id here — a stale `OMEGAHIVE_RUN_ID` left standing in a
  # deploy env once had it paging an empty acceptance run for a week (decisions.md
  # 2026-07-28), and the fix was to delete the surface rather than guard it. A run entering
  # or leaving the active window needs no redeploy. To narrow what it follows, the board's
  # own knobs apply (OMEGAHIVE_PORTFOLIO_EXCLUDE / OMEGAHIVE_ACTIVE_WINDOW_DAYS in .env).
  notifier:
    <<: *omega
    command: ["notify"]
    restart: unless-stopped
    environment:
      # Daily-heartbeat hour (UTC, integer). Config, not a secret — so it rides the compose
      # environment here, never notifier.env. Declared in secrets-manifest.yaml (notifier row).
      HEARTBEAT_HOUR_UTC: ${HEARTBEAT_HOUR_UTC:-6}
      # UI base URL for message deep links: the external origin+prefix the phone already uses
      # (e.g. https://<host>:8443/omegahive — the same :8443 the UI is served behind). Config,
      # not a secret; empty default = links absent, render unchanged. Same pattern as above.
      OMEGAHIVE_UI_BASE_URL: ${OMEGAHIVE_UI_BASE_URL:-}
    env_file:
      # OMEGAHIVE_DATABASE_URL (the read path) plus the shared portfolio run cut
      # (OMEGAHIVE_PORTFOLIO_EXCLUDE / OMEGAHIVE_ACTIVE_WINDOW_DAYS).
      - .env
      # required:false so an unconfigured host doesn't break `compose config`/other services;
      # the notifier fails fast at startup if the token/chat are absent.
      #
      # OMEGAHIVE_SECRETS_DIR carries a DEFAULT here (deployment spec §4's canonical
      # location) because it previously had none: unset, this path interpolated to a bare
      # `/notifier.env`, which `required: false` then skipped in silence — a notifier with
      # no token and no complaint until startup. The default makes the documented location
      # the actual location, so `hive-init-secrets` and this file cannot disagree. An
      # exported OMEGAHIVE_SECRETS_DIR still wins (deployment #0 exports exactly this path).
      #
      # One residual case the default does NOT cover: if HOME itself is unset, compose warns
      # and substitutes a blank string, giving `/.config/omegahive/secrets/notifier.env` —
      # skipped in silence again. systemd USER units and cron both provide HOME, so the
      # shipped scheduling paths are fine; a systemd SYSTEM unit or a bare container is not.
      # Set OMEGAHIVE_SECRETS_DIR explicitly in any HOME-less context.
      - path: ${OMEGAHIVE_SECRETS_DIR:-${HOME}/.config/omegahive/secrets}/notifier.env   # TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID
        required: false
    volumes:
      # :z — shared SELinux label so the cursors survive container replacement. Without it,
      # rootless Podman gives each container a unique MCS category and a *new* notifier
      # instance is denied read/write to the previous one's state file (restart breaks).
      - omegahive-notifier:/var/lib/omegahive/notifier:z   # persisted per-run read cursors

  # Containerized backup: pg_dump of the log store from the pinned postgres image
  # (deployment spec §4/§5). `profiles: [ops]` keeps it out of a plain `up`; the
  # host systemd timer runs `compose run --rm backup`. /backups is a HOST bind mount
  # (${OMEGAHIVE_BACKUP_DIR} — the pointer var, no absolute host path in the committed
  # file, per deployment spec §4) so the dumps sit on the host filesystem where the
  # operator pulls them over the tailnet SSH path; the workspace git bundles land in the
  # same directory (deploy/git_bundle.sh) so one directory restores both stores.
  # OMEGAHIVE_BACKUP_KEEP bounds retention (default 14; disk is finite, operator remote).
  #
  # Owner credential: a dump must read every table and a restore must CREATE DATABASE,
  # neither of which hive_reader or hive_gateway can do. This is also the service that
  # runs scripts/roles_rollback.sh — rolling the split back is owner authority by
  # construction, since the roles being dropped cannot drop themselves.
  backup:
    image: postgres:16@sha256:1570e4013933875bf54995e9010e31420b5e21dd5f2524e5395089d480cc2df1
    profiles: ["ops"]
    <<: *owner-env
    environment:
      - OMEGAHIVE_BACKUP_KEEP
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # :z — shared SELinux label; the deploy user (rootless: container root maps to it)
      # owns the dumps, so `rsync beastie:...` reads them without a relabel dance.
      - ${OMEGAHIVE_BACKUP_DIR:-./backups}:/backups:z
      - ./scripts:/scripts:ro,Z
    entrypoint: ["sh", "/scripts/pg_backup.sh"]

volumes:
  omegahive-pgdata:
  omegahive-basis:
  omegahive-notifier:

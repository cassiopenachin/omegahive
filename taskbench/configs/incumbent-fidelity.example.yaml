# Runner config — the incumbent fidelity batch (HIP-1 M1b).
#
# Copy, edit the two `labels` blocks to the model ids you actually resolved, and pass with
# `taskbench run --config`. Nothing here is a secret: credentials reach the agent and the
# reviewer through the operator's own environment via `env_passthrough`, and taskbench never
# reads, logs, or stores them.
#
#   taskbench run --config taskbench/configs/incumbent-fidelity.yaml \
#     --record-id incumbent-fidelity --work-root ~/work/taskbench
#
# Resolve the labels before you launch — a cell whose vendor/model/harness is missing is
# refused, because an unattributable result is the gap this instrument exists to close:
#
#   claude --version          # harness version, e.g. "2.1.229 (Claude Code)"

agent:
  # argv, never a shell string. The kickoff is written to <cell>/TASK.md and, with
  # prompt_mode: argv, also appended as the final argument.
  argv:
    - claude
    - --permission-mode
    - auto
    - --print
  labels:
    vendor: anthropic
    model: claude-fable-5          # pin the resolved id, not the alias you typed
    harness: claude-code-2.1.229   # from `claude --version`
  env_passthrough:
    - HOME
    - PATH
    - TERM
    - LANG
    - ANTHROPIC_API_KEY           # only if your harness needs it; a subscription login does not
  env:
    # The candidate works in a fresh export with no remote. Say so to anything that asks.
    GIT_TERMINAL_PROMPT: '0'
  cwd: code
  timeout_s: 7200
  prompt_mode: argv
  # If your harness writes a JSONL transcript or a usage summary into the cell, name them
  # here and the record stops saying `unknown` for first_read and for token counts.
  # transcript_jsonl: run/transcript.jsonl
  # usage_json: run/usage.json

reviewer:
  argv:
    - claude
    - --permission-mode
    - auto
    - --print
  labels:
    vendor: anthropic
    model: claude-opus-5
    harness: claude-code-2.1.229
  env_passthrough:
    - TERM
    - LANG
    - ANTHROPIC_API_KEY
  timeout_s: 3600
  prompt_mode: argv
  # The reviewer runs inside a mount namespace that binds the packet and nothing else.
  # `taskbench sandbox-default` prints the wrapper; override it only if you must.
  # Bind the least your reviewer CLI needs. Binding anything that contains the cell roots
  # makes the cold-reader probe fail — which is the probe working, not a bug to route around.
  sandbox_ro_binds:
    - ~/.local/bin        # where the reviewer CLI lives
    - ~/.local/share/uv   # its managed runtime, if it has one
    - /etc/pki            # CA bundle, so the API call can complete

# Where the materializer finds objects. Deployment facts: they differ per host, so they live
# here rather than in the frozen manifests.
workspace_repo_path: ~/workspaces/hive
source_repos:
  cassiopenachin/omegahive: ~/src/SNET/omegahive
  cassiopenachin/plnbench: ~/src/SNET/plnbench
  rTreutlein/PeTTaChainer: ~/src/SNET/PeTTaChainer
  trueagi-io/PeTTa: ~/src/SNET/PeTTa

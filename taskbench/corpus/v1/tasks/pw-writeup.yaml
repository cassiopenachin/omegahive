# taskbench corpus v1 — manifest for pw-writeup (attempt 2). Frozen; edits increment the corpus version.
id: pw-writeup
project: pln-benchmarks
run: plnbench
title: pw-writeup — the ProofWriter cluster narrative, written for a reader outside the project
task_class: judgment
work_shape: technical-writing
replayable_because: 'Everything this order consumes is a committed document at a resolvable sha,
  and the order itself stop-lines execution — no runs, no smoke, no reproduction — so the replay
  needs no runtime, no dataset and no network at all. The pre-task state is the plnbench merge that
  the order says the story needs; the accepted outcome is a single-file rewrite of the report; and
  the finish-time checks test the order''s own writing standard, which the order states as four
  rules with a test each, rather than testing the accepted prose. The one real difference from the
  historical launch is declared under withheld_inputs.'

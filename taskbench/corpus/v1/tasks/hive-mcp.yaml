# taskbench corpus v1 — manifest for hive-mcp. Frozen; edits increment the corpus version.
id: hive-mcp
project: omegahive
run: omegahive
title: hive-mcp — live read-only hive state through the desktop bridge
task_class: standard
work_shape: api-service
replayable_because: 'The order specifies its own interface precisely enough to grade without
  reading a patch: three paths under /api/v1 on the existing operator origin, two MCP tools by
  name, one executable by name, stdio transport, stdout that carries protocol only. The
  application factory the routes must attach to already accepted injected factories and already
  had a memory-backed demo mode at the task''s baseline, so the routes are called for real with
  no database; and a stdio server''s tool inventory answers a plain protocol handshake with no
  upstream. The two legs that need a machine this instrument does not have — the operator''s
  desktop-bridge round-trip and a deployment check over live containers — are declared, not
  quietly scored.'
workspace_repo: hive-workspace

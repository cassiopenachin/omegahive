expected_output_kinds:
- doc_update
- repro_script
- tests
required_artefacts:
- docs/fol-pln-mapping.md
- benchmarks/folio/REPORT.html
required_changes:
- docs/fol-pln-mapping.md
- tests/repros/fol/*
environment_needs:
- The FOLIO source snapshot in the operator's taskbench source cache, both files matching their
  pinned digests. Preflight refuses without them; the runner never fetches.
- The three dependency bundles are exported into deps/ and are the only source for the pinned
  upstream repositories; there is no network fetch of them.
- SWI-Prolog and the pinned runtime's own prerequisites, for the micro-examples the note's
  encoding decisions rest on.
- uv on PATH, with a warm cache or network.
verifiers:
- id: note-answers-the-converter-order
  argv:
  - python3
  - '{corpus}/verifiers/fol_pln_note_shape.py'
  - .
  timeout_s: 900
  description: 'the holes a converter order would fall into, checked against what this order
    enumerates: a decision or declared gap for every FOL construct it lists, a measured
    frequency table, both reporting arms with a realization path that does not edit the vendored
    runtime, a run protocol with scale, budget, timeout and liveness canaries, micro-examples
    that assert rather than merely run, and a seeded report section carrying the two published
    baselines the order quotes with at least one source'
- id: pytest-offline
  argv:
  - uv
  - run
  - --frozen
  - pytest
  - -q
  - -m
  - not runtime
  timeout_s: 1800
  description: the repository's own offline suite green — the no-regressions bar. The
    runtime-marked tests are excluded here because they shell out to the pinned runtime and are
    the micro-examples' own leg, judged in review from the evidence the attempt records
checklist:
- id: encodings-verified-not-argued
  text: Every encoding decision at or above the order's frequency threshold rests on a runnable
    micro-example whose expected value was captured from the runtime before being asserted, not
    on an argument about what the rule set ought to do.
- id: gaps-compared
  text: Every declared gap compares the candidate treatments the order names — a rewrite,
    abstaining on the item, excluding with a count — and recommends one, with the reason.
- id: semantics-not-score
  text: 'No encoding is argued for on the grounds that it scores better. The order disqualifies
    that argument by construction because this benchmark family rewards weakening the reasoner;
    reporting the effect is fine, reasoning from it is not.'
- id: errata-recorded-not-fixed
  text: Dataset annotation quirks encountered are recorded with a count and examples, and are
    not repaired.
- id: arithmetic-checked
  text: The run protocol's cost arithmetic is checked against the dataset's actual size rather
    than carried over from the previous benchmark, and the note says which figures it re-derived.
- id: escalation-honoured
  text: If a construct above the order's escalation threshold has no sound encoding candidate at
    all, that is raised as a question rather than resolved unilaterally.
- id: result-report
  text: A result report exists under the project's reports directory carrying What shipped / How
    verified / To operate / Reflection, and its claims match what the attempt actually did.
  applicable: offline
stop_lines:
- id: no-converter-no-scale-runs
  text: No converter implementation and no dataset-scale runs — micro-examples only.
- id: no-vendor-edits
  text: No edits under the vendored runtime. A derived rule file, if recommended, is specified in
    the note with its provenance and regeneration, never built here.
  forbidden_paths:
  - vendor/*
- id: semantics-only
  text: Encoding choices are justified by FOL semantics and micro-verification only.
non_replayable_legs:
- leg: Re-verify the published neurosymbolic comparison figures at their sources.
  reason: 'Needs fresh retrieval of public papers, which this offline instrument does not supply
    — and unlike the dataset, their launch-era digests were never recorded, so there is nothing
    to pin a snapshot against. The two figures the ORDER itself states are required and checked;
    the rest of section 2 is graded for shape and for honest marking, never for having been
    verified. A future corpus version can close this by pinning a source packet at first fetch.'
  executed_by: not-executed
- leg: Record the two-arm recommendation in the workspace decisions log for operator
    ratification.
  reason: A write to the live hive workspace. The instrument never touches it, and the
    recommendation itself IS in the note and is graded.
  executed_by: operator
- leg: Post the prepared upstream filings.
  reason: The order already leaves posting to the operator. What the attempt PREPARED — repro
    plus suggested text — is in the diff and is graded.
  executed_by: operator
- leg: Announce the result on the spine per WORKER.md.
  reason: A spine emit, which this instrument's own scope forbids. The report the order asks for
    IS written and graded — only the announcement is out of reach.
  executed_by: not-executed
writable_workspace_paths:
- projects/pln-benchmarks/reports/*
rubric: rubrics/fol-pln-mapping.md
grading: grading/fol-pln-mapping.yaml

# taskbench corpus v1 — manifest for fol-pln-mapping. Frozen; edits increment the corpus version.
id: fol-pln-mapping
project: pln-benchmarks
run: plnbench
title: fol-pln-mapping — FOLIO's FOL inventory vs lib_pln, encodings decided or gaps declared
task_class: judgment
work_shape: research-design
replayable_because: 'The order''s deliverable is a design note plus runnable micro-examples, and
  both are checkable against what the order itself enumerates: a decision or a declared gap for
  every FOL construct it lists, a measured frequency table, the two-arm recommendation with a
  realization path, and a run protocol with budget, timeout and liveness policy. The inputs are a
  public dataset and three pinned upstream repositories, all supplied to the cell as content-
  hashed snapshots, so the note is measured against the same bytes the historical worker read.
  One leg — verifying the published neurosymbolic comparison figures at source — needs fresh web
  retrieval this instrument cannot supply and is declared, not silently graded.'
workspace_repo: hive-workspace

- name: folio-dataset
  kind: source_snapshot
  ref: Yale-LILY/FOLIO data/v0.0
  note: 'The public release the inventory is measured on. The two digests are the ones the
    closed task recorded on 2026-07-29 and checked on every load, so they are launch-era by
    construction rather than by a fetch made later. The runner NEVER fetches: the operator
    places these two files in the source cache once, preflight verifies both digests, and a
    mismatch refuses the cell rather than measuring a different dataset under the same name.
    The benchmark therefore measures this task against THIS packet, not against a fresh web
    search — which is also the only way two harnesses can be compared on it at all.'

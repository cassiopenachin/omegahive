# taskbench corpus v1 — manifest for sole-write-path. Frozen; edits increment the corpus version.
id: sole-write-path
project: omegahive
run: omegahive
title: sole-write-path — the gateway becomes the only writer, and the manifest gets teeth
task_class: standard
work_shape: python-service
replayable_because: 'The order''s central deliverable is a privilege boundary in a database, and
  a privilege boundary is reproducible anywhere Postgres is: the migration the candidate writes is
  applied to a scratch database and the boundary is then interrogated by asking the server, not by
  reading the diff. Every consumer re-point is ordinary Python in the same repository. The two legs
  that genuinely need a running deployment — the durable cutover and the scan against live
  containers — are declared, one as the operator''s and one as a rubric judgement over the
  candidate''s own evidence, and neither is silently scored. The pre-task base is main immediately
  before the accepted merge and the accepted outcome is that merge.'
workspace_repo: hive-workspace
workspace_inputs:

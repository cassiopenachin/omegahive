# GRADER-ONLY. Never enters a candidate root and never enters a review packet.
task_id: hive-mcp
accepted_outcome:
- |-
  One shared read service produces the projections both the operator view and the JSON surface
  return, so there is one fold rather than two that can disagree.
- |-
  Three read-only paths under /api/v1 on the existing operator origin — health, portfolio, and
  one task's detail — with typed response models whose schemas are published in the code
  documentation.
- |-
  Every response says when it was observed, which window or cut produced it, and which cursor
  and generation each run was read at; duration is reported only where the run's clock supports
  it, and is unavailable with its clock kind named otherwise.
- |-
  Output is bounded everywhere it could grow: an explicit maximum and truncation marker on full
  history, and a documented hard cap on a task's event timeline.
- |-
  A standalone stdio executable registers exactly two structured-output tools and nothing else —
  no prompt, sampling, elicitation, resource, write tool or generic fetch — with stdout carrying
  protocol only and logs on stderr.
- |-
  The upstream origin comes from operator-owned configuration validated at startup; no tool
  argument can move it, and unreachable, timeout, invalid TLS, schema mismatch and malformed
  JSON are distinct safe errors.
- |-
  The client machine holds no database, gateway, provider or reverse-proxy credential, opens no
  listening port, and the access layer is untouched.
known_defect_classes:
- |-
  A transport-error classifier that looks for the underlying cause in one place only. The
  libraries in this space nest the real cause several levels deep and in a different attribute,
  so a shallow check silently reports every certificate failure as unreachable — the two errors
  the order requires to be distinguishable become one.
- |-
  A test default that keys off the wrong condition, so tests that mean to exercise a fake
  backend silently exercise the real one. The tell is a health route that works in a suite with
  no database configured for it.
- |-
  An "untruncated total" computed after the page filter, so it shrinks as a caller pages
  backward — a field that contradicts its own description.
- |-
  Unhandled error types escaping the bounded client: a library's malformed-URL or decoding error
  that is not a subclass of the one exception the caller catches reaches every call site raw.
- |-
  An install or refresh subprocess with no timeout, which turns a flaky network into a hung
  bridge process the operator cannot diagnose.
- |-
  Duplicated error-mapping at every route and tool rather than in one place, which is where the
  next extension will diverge.
- |-
  Logging to stdout in a stdio protocol server, which corrupts the transport.

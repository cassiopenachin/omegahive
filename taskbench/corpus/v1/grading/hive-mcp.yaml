notes: 'The order authorises two reviewer invocations and the closed task used both. The state
  immediately before the first of them is the hive-mcp packet of the reviewer corpus. Two things
  this cell cannot decide and says so in the rubric rather than pretending: whether the freshness
  metadata is TRUTHFUL (a wall-clock claim over a simulated run is a defect no schema check can
  see) and whether the fixed origin resists a redirect — both need an upstream the candidate
  configures at a path the order does not fix. The executable''s own suite is run as a
  no-regression and coherence bar; it is the candidate''s own suite, so it is evidence about
  self-consistency rather than an independent gate, and the blinded review reads it as such.'

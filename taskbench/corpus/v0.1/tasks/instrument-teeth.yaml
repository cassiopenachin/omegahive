# taskbench corpus v0.1 — manifest for instrument-teeth. Frozen; edits increment the corpus version.
id: instrument-teeth
project: omegahive
run: omegahive
title: instrument-teeth — the predictions gate becomes a tool, not a reading
task_class: bounded
work_shape: shell-tooling
bounded_because: 'Six numbered scope items, each with its own lettered acceptance case in the DoD, and
  two pre-decided folds. Every case is a drill assertion; the order even fixes the vocabulary the validator
  must accept and the two Watch folds'' dispositions. Nothing is left for the worker to design: the
  one wording gap it contains (the phrase that spells the declared-unpredicted disposition) is a naming
  choice inside a stated case, not a design decision.'
workspace_repo: hive-workspace
workspace_inputs:

  description: lint clean
- id: no-token-in-output
  argv:
  - uv
  - run
  - --frozen
  - pytest
  - -q
  - tests/test_notifier.py
  timeout_s: 900
  description: the notifier suite, including the token-absence checks
checklist:
- id: byte-identical-unset
  text: With the base URL unset, every message renders byte-identically to before — the link is additive,
    never structural.
- id: config-not-secret
  text: 'The new variable follows the config-not-secret pattern: compose environment with an empty default
    and an entry on the allowed list, never in the env file.'
- id: phone-round-trip
  text: One real notification on the phone opens the UI page over the tailnet — the deploy check, not
    a code check.
  applicable: operator
- id: result-report
  text: A result report exists under the project's reports directory carrying What shipped / How verified
    / To operate / Reflection, and its claims match what the attempt actually did.
  applicable: offline
non_replayable_legs:
- leg: One real notification on the phone opens the UI page over the tailnet.
  reason: 'Deliberately not mocked. A stub would stand in for the deploy, not for anything the candidate
    wrote: everything under its control — the link is present and correct when the base URL is set,
    the render is byte-identical when it is unset, trailing slashes normalize, escaping holds, the token
    appears nowhere — is already the order''s own Tests section and is checked deterministically. What
    remains is that the deployed service is reachable from a physical device over the tailnet, which
    is a deploy check the order itself calls the operator''s close-time act.'
  executed_by: operator
- leg: Announce the result on the spine per WORKER.md.
  reason: A spine emit, which this instrument's own scope forbids. The report the order asks for IS
    written and graded — only the announcement is out of reach.
  executed_by: not-executed
stop_lines:
- id: outbound-only
  text: Outbound only — no inbound surface, no bot commands, no ack path, no new trigger types.
- id: no-ui-changes
  text: No UI changes.
  forbidden_paths:
  - src/omegahive/ui/*

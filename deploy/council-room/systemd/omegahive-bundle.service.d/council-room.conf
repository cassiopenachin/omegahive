# Council room addition to the daily workspace backup (deploy/council-room/README.md).
# The shared council clone holds uncommitted drafts no bundle sees; the room config is not in
# Git. The config file is named alone: its directory also holds the room's secrets, which
# stay out of backups. Installed to ~/.config/systemd/user/omegahive-bundle.service.d/.
[Service]
Environment=OMEGAHIVE_ARCHIVE_SOURCES=%h/workspaces/hive-council:%h/.config/omegahive/council-room/openclaw.json

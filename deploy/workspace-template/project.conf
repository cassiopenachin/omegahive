# project.conf — @PROJECT@ project identity (committed, deployment-independent).
#
# Seeded by `scripts/hive-init-workspace` from the omegahive repo's committed
# template (deploy/workspace-template/project.conf).
#
# Sourced by the operator tooling (omegahive repo scripts/hive-common.sh:
# load_project_conf) to resolve which run a launch/answer/close acts on, so run
# identity is a committed fact the worker clones — never a per-shell env var that
# can drift (the tooling's most recurrent bug class is a misconfigured run id).
#
# Carries ONLY facts true on any host. Host-specific facts — the canonical code
# checkout path, work roots, the worker command — live in the deployment layer
# (scripts/hive-common.sh env-default block; CANON_CODE derives from
# CANON_ROOT/<repo basename of CODE_REPO>). See the omegahive README
# "project.conf" section for the fact boundary and config precedence.
#
# Format: plain shell-sourceable KEY=VAL. Precedence: an env override
# (HIVE_RUN_ID / CODE_REPO) wins over these; these win over the deployment defaults.

RUN_ID=@PROJECT@
CODE_REPO=@CODE_REPO@

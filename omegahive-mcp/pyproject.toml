[project]
name = "omegahive-mcp"
version = "0.1.0"
description = "Read-only stdio MCP server for one operator's omegahive hive, over the desktop bridge"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "mcp>=2.0.0,<3",
]

[project.scripts]
omegahive-mcp = "omegahive_mcp:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
    # test-only, schema-parity guard against ../src/omegahive/api/models.py — never
    # installed at runtime; the Mac executable never depends on the server package.
    "omegahive",
]

[tool.uv.sources]
omegahive = { path = "..", editable = false }

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

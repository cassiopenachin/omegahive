# secrets-manifest.yaml — the env-var NAMES each service may see (deployment spec §4).
#
# Names only, never values. Secrets live in ${OMEGAHIVE_SECRETS_DIR} (per-host, mode 0700;
# files 0600), one env-file per service scoped to its role — never in the repo tree, an
# image, the lockfile, or any record.
#
# THIS FILE IS ENFORCED. `scripts/credential_scope_scan.sh` reads every running
# container's env-var names and diffs them against its service's row here. A name present
# in a container and absent from its row exits non-zero; a declared name the container
# lacks is reported and does not fail. A running service with no row is a hard fail — an
# undeclared service is not an exempt one. There is no exception list, and adding one is
# not the fix for a false positive: a legitimately-present variable is declared here, in a
# line a reviewer can see. (Until 2026-08-01 this file was decorative — declared and
# unchecked for three waves; OPERATIONS pain 10.)
#
# Structure:
#   groups:   named sets of env-var names, so the base-image and shared-.env names are
#             declared once rather than once per row. A group is a declaration, not an
#             exemption — a row carries only the groups it lists under `includes:`.
#   services: one row per credential class. `compose_services:` names the compose services
#             the row covers (the two namings differ: one row covers several services);
#             `env_file:` is provenance; `allowed:` is the row's own names.
#
# The three DB credentials (migrations/0003_two_roles.sql, docker-compose.yml):
#   OMEGAHIVE_DATABASE_URL          hive_reader   .env          every service
#   OMEGAHIVE_GATEWAY_DATABASE_URL  hive_gateway  gateway.env   the services that emit
#   OMEGAHIVE_OWNER_DATABASE_URL    the owner     owner.env     migrate / test / backup

groups:
  # Put there by the OCI runtime and the base images — in every container of the stack.
  runtime:
    - container
    - HOME
    - HOSTNAME
    - LANG
    - PATH

  # The python:3.12-slim base plus this repo's Dockerfile ENV. GPG_KEY is the base image's
  # *public* Python-release signing fingerprint, not a secret.
  python-image:
    - GPG_KEY
    - PYTHON_SHA256
    - PYTHON_VERSION
    - PYTHONUNBUFFERED
    - UV_LINK_MODE
    - UV_PYTHON_DOWNLOADS

  # The pinned postgres:16 base image.
  postgres-image:
    - GOSU_VERSION
    - PGDATA
    - PG_MAJOR
    - PG_VERSION

  # `.env`, which EVERY service reads — so this list is the standing answer to "what does
  # a compromised container see?", and nothing stronger than the read credential may join
  # it. All of it is config or the read DSN.
  shared-env:
    - OMEGAHIVE_DATABASE_URL         # the read path (hive_reader after cutover)
    - OMEGAHIVE_RUN_ID               # acceptance run id; also compose interpolation
    - OMEGAHIVE_ACTIVE_WINDOW_DAYS   # active window for board + portfolio (config)
    - OMEGAHIVE_PORTFOLIO_EXCLUDE    # scratch-run globs for the portfolio (config)
    - OMEGAHIVE_BACKUP_KEEP          # dump retention (config)
    - OMEGAHIVE_PG_TAILNET_BIND      # postgres' tailnet bind; compose interpolation

  # Only services that merge x-omega WITHOUT an `environment:` block of their own inherit
  # the anchor's provenance passthrough; ui and notifier replace that block and so do not.
  omega-anchor:
    - OMEGAHIVE_PORT_LIBRARY_SHA

services:
  postgres:
    env_file: postgres.env
    compose_services: [postgres]
    includes: [runtime, postgres-image]
    allowed:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB

  # The WRITE path: the services that emit through the gateway. `gateway.env` carries
  # hive_gateway's DSN and reaches these containers and no others.
  gateway:
    env_file: gateway.env
    compose_services: [cli, seed, coordinator, worker, review, deploy-checks]
    includes: [runtime, python-image, shared-env, omega-anchor]
    allowed:
      - OMEGAHIVE_GATEWAY_DATABASE_URL

  # The SCHEMA path: DDL and database lifecycle. `owner.env` carries the owner's DSN and
  # reaches only these two — no long-running service ever holds it.
  owner:
    env_file: owner.env
    compose_services: [migrate, test]
    includes: [runtime, python-image, shared-env, omega-anchor]
    allowed:
      - OMEGAHIVE_OWNER_DATABASE_URL
      - OMEGAHIVE_TEST_DATABASE_URL

  # Read-only omegahive-image services: no write credential of any kind.
  reader:
    env_file: none — .env only
    compose_services: [board-view, lint]
    includes: [runtime, python-image, shared-env, omega-anchor]
    allowed: []

  # The read-only operator web UI (ui spec §2/§9): it reads under hive_reader and writes
  # only through the gateway, so it holds no INSERT credential and has no admin side-door.
  # Its knobs are serving config, not secrets.
  ui:
    env_file: none — .env only
    compose_services: [ui]
    includes: [runtime, python-image, shared-env]
    allowed:
      - OMEGAHIVE_UI_BASE_PATH     # serving path prefix behind a reverse proxy (config)
      - OMEGAHIVE_UI_HOST          # container listen address (config)
      - OMEGAHIVE_UI_PORT          # container listen port (config)

  # Provider keys for harness-driven runs (the LLM coordinator ladder). They terminate
  # here, never in an agent container. The ladder also emits, so it carries the gateway
  # DSN — the one service holding both a provider key and a write credential.
  harness:
    env_file: harness.env
    compose_services: [ladder]
    includes: [runtime, python-image, shared-env, omega-anchor]
    allowed:
      - OMEGAHIVE_GATEWAY_DATABASE_URL
      - OPENROUTER_API_KEY
      - ANTHROPIC_API_KEY

  # The outbound attention-notifier (hive-native ops §2 item 4). A spine FOLLOWER: it reads
  # under hive_reader and has no write path at all. TELEGRAM_BOT_TOKEN is its only
  # credential; outbound-only, never logged and never placed in a message.
  notifier:
    env_file: notifier.env
    compose_services: [notifier]
    includes: [runtime, python-image, shared-env]
    allowed:
      - TELEGRAM_BOT_TOKEN       # bot credential — outbound sendMessage only
      - TELEGRAM_CHAT_ID         # destination chat (config, not a secret)
      - TELEGRAM_API_BASE        # optional endpoint override (self-host / tests)
      - HEARTBEAT_HOUR_UTC       # daily-heartbeat hour (config; compose env)
      - OMEGAHIVE_UI_BASE_URL    # deep-link base for messages (config; compose env)

  # The containerized pg_dump, the restore drill, and the roles rollback — postgres image.
  # Owner authority by construction: a dump reads every table and a restore creates
  # databases. `profiles: [ops]`, so the scan sees it only while it is running.
  backup:
    env_file: owner.env
    compose_services: [backup]
    includes: [runtime, postgres-image, shared-env]
    allowed:
      - OMEGAHIVE_OWNER_DATABASE_URL
      - OMEGAHIVE_TEST_DATABASE_URL
      - OMEGAHIVE_RESTORE_DB     # restore-drill target database name (config)

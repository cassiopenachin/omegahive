name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omegahive
          POSTGRES_PASSWORD: omegahive
          POSTGRES_DB: omegahive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omegahive"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      OMEGAHIVE_DATABASE_URL: postgresql://omegahive:omegahive@localhost:5432/omegahive
      # Base DSN only: each run creates and drops its own database on this server
      # (tests/scratch_db.py), so there is nothing to create up front.
      OMEGAHIVE_TEST_DATABASE_URL: postgresql://omegahive:omegahive@localhost:5432/omegahive_test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy

      - name: Test (pytest)
        run: uv run pytest -q

      - name: API schema doc is up to date
        run: uv run python scripts/emit_api_schemas.py --check

  mcp:
    # omegahive-mcp is a fully standalone project (its own pyproject.toml/uv.lock,
    # no shared venv with the job above) — the Mac-side executable this proves out
    # never carries the server's dependencies. Its dev-only schema-parity test does
    # depend on `omegahive` (path = ".."), which this checkout provides.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        working-directory: omegahive-mcp
        run: uv sync --group dev

      - name: Lint (ruff)
        working-directory: omegahive-mcp
        run: uv run ruff check .

      - name: Type-check (mypy)
        working-directory: omegahive-mcp
        run: uv run mypy src tests

      - name: Test (pytest)
        working-directory: omegahive-mcp
        run: uv run pytest -q
